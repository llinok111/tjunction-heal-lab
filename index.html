<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>T-Junction Heal Lab — conforming multi-resolution seams</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 system-ui, sans-serif; background: #0d1117; color: #d7dee8; overflow: hidden; }
  #app { display: grid; grid-template-columns: 310px 1fr; height: 100vh; }
  aside { padding: 18px; border-right: 1px solid #21262d; overflow-y: auto; }
  h1 { font-size: 17px; margin: 0 0 4px; }
  .sub { color: #8b949e; font-size: 12px; margin-bottom: 18px; }
  button { width: 100%; margin: 4px 0; padding: 8px 10px; background: #161b22; color: #d7dee8;
    border: 1px solid #30363d; border-radius: 6px; cursor: pointer; text-align: left; }
  button.active { border-color: #58a6ff; background: #182534; }
  label { display: flex; gap: 8px; align-items: center; margin: 10px 0; color: #b6c2cf; font-size: 13px; }
  .stats { margin-top: 14px; border-top: 1px solid #21262d; padding-top: 12px; font-size: 12.5px; }
  .row { display: flex; justify-content: space-between; gap: 8px; padding: 2px 0; }
  .k { color: #8b949e; } .v { font-variant-numeric: tabular-nums; }
  .ok { color: #3fb950; } .bad { color: #f85149; } .warn { color: #d29922; }
  #view { position: relative; }
  canvas { display: block; }
  #legend { position: absolute; left: 16px; bottom: 14px; padding: 8px 12px; background: #0d1117cc;
    border: 1px solid #30363d; border-radius: 6px; font-size: 12px; color: #8b949e; }
  #legend b { color: #d7dee8; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="app">
  <aside>
    <h1>T-Junction Heal Lab</h1>
    <div class="sub">Multi-resolution seams → conforming watertight mesh.<br>Same <code>src/core.mjs</code> as node.</div>
    <div id="corpora"></div>
    <label><input id="showRaw" type="checkbox" checked> show defective wireframe + T-junctions</label>
    <label><input id="rotate" type="checkbox"> auto-rotate</label>
    <div class="stats" id="stats"></div>
  </aside>
  <div id="view">
    <div id="legend">
      <span class="dot" style="background:#8b949e"></span><b>healed surface</b><br>
      <span class="dot" style="background:#d29922"></span>defective seam edges<br>
      <span class="dot" style="background:#f85149"></span>T-junction vertices
    </div>
  </div>
</div>
<script type="module" src="./main.js"></script>
</body>
</html>
